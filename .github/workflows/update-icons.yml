name: Update Icons

on:
  workflow_dispatch:
  push:
    paths:
      - icons/manifest.yaml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - run: |
          bash .github/scripts/build.sh icons

          source .github/scripts/build.sh

          sync_changes icons
